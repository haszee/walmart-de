snapshots:
  - name: dim_orders
    description: "Snapshot of the dim_orders table, capturing historical changes over time."
    relation: ref('eph_orders')
    config:
      schema: gold
      database: walmart
      unique_key: order_id
      strategy: timestamp
      updated_at: order_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that the record is valid until `'9999-12-31'` instead of `NULL`.