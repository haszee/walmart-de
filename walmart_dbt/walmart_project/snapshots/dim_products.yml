snapshots:
  - name: dim_products
    description: "Snapshot of the dim_products table, capturing historical changes over time."
    relation: ref('eph_products')
    config:
      schema: gold
      database: walmart
      unique_key: product_id
      strategy: timestamp
      updated_at: product_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that the record is valid until `'9999-12-31'` instead of `NULL`.